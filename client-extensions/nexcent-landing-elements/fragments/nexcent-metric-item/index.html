<button
    aria-haspopup="dialog"
    class="nxc-metric-item"
    data-nxc-modal='{"version":1,"slots":{"comparison":{"current":{"read":"text","selector":".nxc-metric-item__value"},"previous":{"read":"text","selector":".nxc-metric-item__previous-value"}},"eyebrow":{"value":"Latest metric"},"facts":[{"label":{"value":"Last updated"},"value":{"read":"text","selector":".nxc-metric-item__snapshot-date"}}],"media":{"read":"image","selector":".nxc-metric-item__icon"},"primaryValue":{"read":"text","selector":".nxc-metric-item__value"},"title":{"read":"text","selector":".nxc-metric-item__label"}}}'
    type="button"
>
    <img
        alt="Metric"
        class="nxc-metric-item__icon"
        data-lfr-editable-id="metricIcon"
        data-lfr-editable-type="image"
        src="[resources:metric-placeholder.svg]"
    />

    <div class="nxc-metric-item__info">
        <p
            class="nxc-metric-item__value"
            data-lfr-editable-id="metricValue"
            data-lfr-editable-type="text"
            data-nxc-metric-value
        >
            0
        </p>
        <p
            class="nxc-metric-item__label"
            data-lfr-editable-id="metricLabel"
            data-lfr-editable-type="text"
        >
            Metric
        </p>
    </div>

    <span
        aria-hidden="true"
        class="nxc-metric-item__modal-data nxc-metric-item__previous-value"
        data-lfr-editable-id="previousMetricValue"
        data-lfr-editable-type="text"
    >
        0
    </span>
    <span
        aria-hidden="true"
        class="nxc-metric-item__modal-data nxc-metric-item__snapshot-date"
        data-lfr-editable-id="snapshotDate"
        data-lfr-editable-type="text"
    >
        Not available
    </span>
</button>
